# Docker Compose for fastapi-translation (local dev — same app as ECS)
services:
  fastapi-translation:
    build: .
    image: fastapi-translation:local
    container_name: fastapi-translation-app
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface_cache:
