<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English to Turkish Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-2xl bg-white p-8 rounded shadow">
      <h2 class="text-2xl font-semibold mb-6 text-center text-gray-800">
        🌍 English to Turkish Translator
      </h2>

      <div class="mb-4">
        <label for="textInput" class="block text-gray-700 font-medium mb-2"
          >Enter English Text:</label
        >
        <textarea
          id="textInput"
          rows="4"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400 focus:outline-none resize-none"
          placeholder="Type your sentence here..."
        ></textarea>
      </div>

      <div class="flex justify-center">
        <button
          onclick="runTranslation()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded shadow"
        >
          Translate & Speak
        </button>
      </div>

      <div class="flex justify-center mt-4">
        <div id="loadingSpinner" class="hidden">
          <svg
            class="animate-spin h-6 w-6 text-blue-600"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.372 0 0 5.373 0 12h4z"
            />
          </svg>
        </div>
      </div>

      <div class="mt-6">
        <h3 class="text-lg font-medium text-gray-800 mb-1">Translated Text:</h3>
        <p id="translatedText" class="text-green-700 font-semibold text-xl"></p>
      </div>
    </div>

    <script>
      async function runTranslation() {
        const text = document.getElementById("textInput").value.trim();
        const spinner = document.getElementById("loadingSpinner");
        const translatedTextEl = document.getElementById("translatedText");

        if (!text) {
          alert("Please enter some English text.");
          return;
        }

        spinner.classList.remove("hidden");
        translatedTextEl.innerText = "";

        try {
          // Audio request
          const response = await fetch(
            "http://127.0.0.1:3000/translate-and-speak/",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text }),
            }
          );

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText);
          }

          const audioBlob = await response.blob();
          const audioUrl = URL.createObjectURL(audioBlob);
          new Audio(audioUrl).play();

          // Translation request
          const translationResp = await fetch(
            "http://127.0.0.1:3000/translate/",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text }),
            }
          );

          if (translationResp.ok) {
            const data = await translationResp.json();
            translatedTextEl.innerText = data.translated_text;
          } else {
            translatedTextEl.innerText = "Translation failed.";
          }
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          spinner.classList.add("hidden");
        }
      }
    </script>
  </body>
</html>
