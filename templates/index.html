<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English to Turkish Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-2xl bg-white p-8 rounded shadow">
      <h2 class="text-2xl font-semibold mb-6 text-center text-gray-800">
        🌍 English to Turkish Translator
      </h2>

      <div class="mb-4">
        <label for="textInput" class="block text-gray-700 font-medium mb-2"
          >Enter English Text:</label
        >
        <textarea
          id="textInput"
          rows="4"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400 focus:outline-none resize-none"
          placeholder="Type your sentence here..."
        ></textarea>
      </div>

      <div class="flex justify-center space-x-4">
        <button
          onclick="runTranslation()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded shadow"
        >
          Translate
        </button>
        <button
          onclick="speakText()"
          id="speakBtn"
          class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded shadow disabled:opacity-50"
          disabled
        >
          🔊 Speak
        </button>
      </div>

      <div class="flex justify-center mt-4">
        <div id="loadingSpinner" class="hidden">
          <svg
            class="animate-spin h-6 w-6 text-blue-600"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.372 0 0 5.373 0 12h4z"
            />
          </svg>
        </div>
      </div>

      <div class="mt-6">
        <h3 class="text-lg font-medium text-gray-800 mb-1">Translated Text:</h3>
        <p id="translatedText" class="text-green-700 font-semibold text-xl"></p>
      </div>

      <div class="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded">
        <p class="text-sm text-yellow-800">
          <strong>Note:</strong> This demo uses client-side text-to-speech. For
          best results, make sure your browser supports Turkish language
          synthesis.
        </p>
      </div>
    </div>

    <script>
      let currentTranslation = "";

      async function runTranslation() {
        const text = document.getElementById("textInput").value.trim();
        const spinner = document.getElementById("loadingSpinner");
        const translatedTextEl = document.getElementById("translatedText");
        const speakBtn = document.getElementById("speakBtn");

        if (!text) {
          alert("Please enter some English text.");
          return;
        }

        spinner.classList.remove("hidden");
        translatedTextEl.innerText = "";
        speakBtn.disabled = true;

        try {
          const response = await fetch("/translate/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });

          if (response.ok) {
            const data = await response.json();
            currentTranslation = data.translated_text;
            translatedTextEl.innerText = currentTranslation;
            speakBtn.disabled = false;
          } else {
            translatedTextEl.innerText = "Translation failed.";
          }
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          spinner.classList.add("hidden");
        }
      }

      function speakText() {
        if (!currentTranslation) {
          alert("No translation to speak.");
          return;
        }

        if ("speechSynthesis" in window) {
          // Cancel any ongoing speech
          speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(currentTranslation);
          utterance.lang = "tr-TR"; // Turkish language
          utterance.rate = 0.8; // Slightly slower for clarity
          utterance.pitch = 1.0;

          // Try to find a Turkish voice
          const voices = speechSynthesis.getVoices();
          const turkishVoice = voices.find(
            (voice) =>
              voice.lang.startsWith("tr") || voice.lang.includes("Turkish")
          );

          if (turkishVoice) {
            utterance.voice = turkishVoice;
          }

          speechSynthesis.speak(utterance);
        } else {
          alert("Your browser doesn't support text-to-speech.");
        }
      }

      // Load voices when they become available
      if ("speechSynthesis" in window) {
        speechSynthesis.onvoiceschanged = function () {
          // Voices are now loaded
        };
      }

      // Allow Enter key to trigger translation
      document
        .getElementById("textInput")
        .addEventListener("keypress", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            runTranslation();
          }
        });
    </script>
  </body>
</html>
