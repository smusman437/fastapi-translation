<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English to Turkish Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
            colors: {
              accent: {
                DEFAULT: "#2563eb",
                hover: "#1d4ed8",
                ring: "#93c5fd",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased"
  >
    <div
      class="flex min-h-screen items-center justify-center px-4 py-12 sm:px-6"
    >
      <main class="w-full max-w-2xl">
        <header class="mb-8 text-center">
          <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">
            English to Turkish
          </h1>
          <p class="mt-2 text-sm text-slate-600 sm:text-base">
            Neural translation powered by a fine-tuned language model
          </p>
        </header>

        <div
          class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-sm sm:p-8"
        >
          <div class="space-y-6">
            <div
              id="statusBanner"
              class="hidden rounded-lg border px-4 py-3 text-sm"
              role="alert"
              aria-live="polite"
            ></div>

            <div>
              <label
                for="textInput"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Source text
              </label>
              <textarea
                id="textInput"
                rows="4"
                class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-base text-slate-900 placeholder:text-slate-400 transition-colors focus:border-accent focus:bg-white focus:outline-none focus:ring-4 focus:ring-accent-ring"
                placeholder="Enter English text to translate..."
                aria-describedby="inputHint"
              ></textarea>
              <p id="inputHint" class="mt-2 text-xs text-slate-500">
                Press Enter to translate, Shift+Enter for a new line
              </p>
            </div>

            <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
              <div class="flex flex-1 flex-col gap-3 sm:flex-row">
                <button
                  type="button"
                  onclick="runTranslation()"
                  class="inline-flex min-h-[44px] flex-1 items-center justify-center rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-accent-hover focus:outline-none focus:ring-4 focus:ring-accent-ring disabled:cursor-not-allowed disabled:opacity-60"
                >
                  Translate
                </button>
                <button
                  type="button"
                  onclick="speakText()"
                  id="speakBtn"
                  disabled
                  class="inline-flex min-h-[44px] flex-1 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition-colors hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-200 disabled:cursor-not-allowed disabled:border-slate-100 disabled:bg-slate-50 disabled:text-slate-400"
                >
                  <svg
                    class="h-4 w-4 shrink-0"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                  </svg>
                  Speak
                </button>
              </div>
              <div
                id="loadingSpinner"
                class="hidden h-6 w-6 shrink-0 sm:ml-1"
                aria-hidden="true"
              >
                <svg
                  class="h-6 w-6 animate-spin text-accent"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                  />
                </svg>
              </div>
            </div>

            <div
              class="rounded-xl border border-slate-200 bg-slate-50/80 p-4 sm:p-5"
            >
              <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-slate-500">
                Translation
              </h2>
              <p
                id="translatedText"
                class="min-h-[2.5rem] text-lg font-medium leading-relaxed text-slate-400"
                data-empty="true"
              >
                Your translation will appear here
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      let currentTranslation = "";
      const EMPTY_PLACEHOLDER = "Your translation will appear here";

      const statusBanner = document.getElementById("statusBanner");
      const translatedTextEl = document.getElementById("translatedText");

      function showStatus(message, type) {
        statusBanner.textContent = message;
        statusBanner.classList.remove(
          "hidden",
          "border-red-200",
          "bg-red-50",
          "text-red-800",
          "border-amber-200",
          "bg-amber-50",
          "text-amber-900"
        );
        if (type === "error") {
          statusBanner.classList.add(
            "border-red-200",
            "bg-red-50",
            "text-red-800"
          );
        } else {
          statusBanner.classList.add(
            "border-amber-200",
            "bg-amber-50",
            "text-amber-900"
          );
        }
      }

      function clearStatus() {
        statusBanner.classList.add("hidden");
        statusBanner.textContent = "";
      }

      function setTranslationDisplay(text, isEmpty) {
        translatedTextEl.textContent = text;
        translatedTextEl.dataset.empty = isEmpty ? "true" : "false";
        if (isEmpty) {
          translatedTextEl.classList.add("text-slate-400");
          translatedTextEl.classList.remove("text-slate-900");
        } else {
          translatedTextEl.classList.remove("text-slate-400");
          translatedTextEl.classList.add("text-slate-900");
        }
      }

      async function runTranslation() {
        const text = document.getElementById("textInput").value.trim();
        const spinner = document.getElementById("loadingSpinner");
        const speakBtn = document.getElementById("speakBtn");

        clearStatus();

        if (!text) {
          showStatus("Please enter some English text before translating.", "warn");
          document.getElementById("textInput").focus();
          return;
        }

        spinner.classList.remove("hidden");
        setTranslationDisplay("", true);
        translatedTextEl.textContent = "Translating…";
        speakBtn.disabled = true;
        currentTranslation = "";

        try {
          const response = await fetch("/translate/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });

          if (response.ok) {
            const data = await response.json();
            currentTranslation = data.translated_text;
            setTranslationDisplay(currentTranslation, false);
            speakBtn.disabled = false;
          } else {
            setTranslationDisplay(EMPTY_PLACEHOLDER, true);
            showStatus("Translation failed. Please try again.", "error");
          }
        } catch (err) {
          setTranslationDisplay(EMPTY_PLACEHOLDER, true);
          showStatus("Network error: " + err.message, "error");
        } finally {
          spinner.classList.add("hidden");
        }
      }

      function speakText() {
        clearStatus();

        if (!currentTranslation) {
          showStatus("Translate text first before using Speak.", "warn");
          return;
        }

        if ("speechSynthesis" in window) {
          speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(currentTranslation);
          utterance.lang = "tr-TR";
          utterance.rate = 0.8;
          utterance.pitch = 1.0;

          const voices = speechSynthesis.getVoices();
          const turkishVoice = voices.find(
            (voice) =>
              voice.lang.startsWith("tr") || voice.lang.includes("Turkish")
          );

          if (turkishVoice) {
            utterance.voice = turkishVoice;
          }

          speechSynthesis.speak(utterance);
        } else {
          showStatus(
            "Text-to-speech is not supported in this browser.",
            "error"
          );
        }
      }

      if ("speechSynthesis" in window) {
        speechSynthesis.onvoiceschanged = function () {};
      }

      document
        .getElementById("textInput")
        .addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            runTranslation();
          }
        });
    </script>
  </body>
</html>
